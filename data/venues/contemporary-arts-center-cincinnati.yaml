notes: 'NEEDS REVIEW: Cincinnati''s flagship contemporary art museum presents performance/new
  media and occasional experimental sound, but improvised music is incidental. Cincinnati''s
  stronger experimental thread runs through the pop-up Talk Low festival (Whited Sepulchre
  Records) rather than a fixed venue.'
