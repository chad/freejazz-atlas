name: CI

# A community-maintained data project is only safe to accept PRs into if the
# machine checks the boring things first: schema validity, score consistency,
# no duplicate ids, and a site that still builds. Reviewers should be spending
# their attention on whether a venue claim is *true*.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[crawl]' pytest

      - name: Validate every record (errors fail, warnings are shown)
        run: |
          python -m atlas.cli validate --strict || true
          python -m atlas.cli validate

      - name: Stored scores must match computed scores
        run: |
          out=$(python -m atlas.cli score)
          echo "$out"
          echo "$out" | grep -q "All stored scores already match" \
            || { echo "::error::stored scores drifted from signals — run 'atlas score --write'"; exit 1; }

      - name: Tests
        run: python -m pytest -q

      - name: Build the site
        run: python -m atlas.cli build --base-url https://atlas.mahakalamusic.com

      - name: Report corpus shape
        run: python -m atlas.cli stats

  # Link rot is a fact of life for a venue directory, so it is reported on a
  # schedule rather than gating merges: a venue whose host is down today has not
  # done anything wrong.
  linkcheck:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Check every cited website
        run: python -m atlas.cli linkcheck --workers 24
